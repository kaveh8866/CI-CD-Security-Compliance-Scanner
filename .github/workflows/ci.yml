name: scanner

# Actions are pinned to commit SHAs because the repository's own CG-PIPE-001
# rule requires it.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Explicit gate for every step: do not inherit a weaker template default.
      SCANNER_FAIL_ON: high
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check -r src/requirements.txt

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests

      - name: Start stack
        run: |
          docker compose -f docker/docker-compose.yml up -d --build
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8300/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Smoke scan
        env:
          BASE_URL: http://127.0.0.1:8300
        run: bash tests/smoke.sh

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down
